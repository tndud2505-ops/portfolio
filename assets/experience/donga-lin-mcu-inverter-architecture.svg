<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">LIN 통신 기반 액추에이터 제어 PCB와 3상 인버터 구조</title>
  <desc id="desc">상위 제어기의 LIN 명령이 LIN 트랜시버를 거쳐 MCU의 ASW와 Motor Driver 로직으로 전달되고, 타이머와 출력 제어를 통해 여섯 개 FET로 구성된 3상 인버터와 PMSM을 구동하는 공개용 기술 구조도</desc>
  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#315d4b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#4d7890"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#76827b"/>
    </marker>
    <style>
      .sans { font-family: "IBM Plex Sans KR", "Noto Sans KR", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
      .title { fill: #181a18; font-size: 42px; font-weight: 700; letter-spacing: -1.5px; }
      .subtitle { fill: #657069; font-size: 20px; }
      .eyebrow { fill: #315d4b; font-size: 17px; font-weight: 700; letter-spacing: 1.8px; }
      .section { fill: #181a18; font-size: 24px; font-weight: 700; }
      .label { fill: #181a18; font-size: 18px; font-weight: 700; }
      .body { fill: #657069; font-size: 16px; }
      .tiny { fill: #657069; font-size: 13px; }
      .pin { fill: #315d4b; font-size: 13px; font-weight: 700; }
      .wire { stroke: #315d4b; stroke-width: 4; fill: none; }
      .signal { stroke: #4d7890; stroke-width: 4; fill: none; }
      .feedback { stroke: #76827b; stroke-width: 3; stroke-dasharray: 8 8; fill: none; }
      .hair { stroke: #c4cec5; stroke-width: 2; fill: none; }
      .dark { stroke: #181a18; stroke-width: 3; fill: none; }
      .board { fill: #f0f4f1; stroke: #315d4b; stroke-width: 3; }
      .chip { fill: #1e2924; stroke: #315d4b; stroke-width: 3; }
      .chiptext { fill: #f7f7f5; font-size: 16px; font-weight: 700; }
      .module { fill: #ffffff; stroke: #c4cec5; stroke-width: 2; }
      .fet { fill: #e8f0eb; stroke: #315d4b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="#f7f7f5"/>
  <text x="64" y="62" class="mono eyebrow">ACTUATOR CONTROL ELECTRONICS</text>
  <text x="64" y="116" class="sans title">LIN 통신 · MCU 로직 · 3상 인버터</text>
  <text x="64" y="151" class="sans subtitle">액추에이터 내부 제어 PCB에서 명령을 수신하고 PMSM을 구동하는 구조</text>
  <text x="1536" y="62" text-anchor="end" class="mono tiny">공개용 구조도 · 실제 핀맵/회로값 제외</text>
  <line x1="64" y1="178" x2="1536" y2="178" class="hair"/>

  <g aria-label="상위 제어기">
    <text x="64" y="236" class="mono eyebrow">UPPER CONTROLLER</text>
    <rect x="64" y="264" width="192" height="196" rx="6" fill="#ffffff" stroke="#181a18" stroke-width="3"/>
    <rect x="98" y="300" width="124" height="72" rx="4" fill="#e8f0eb" stroke="#315d4b" stroke-width="2"/>
    <path d="M118 326H202M118 348H182" class="hair"/>
    <circle cx="112" cy="326" r="4" fill="#315d4b"/>
    <circle cx="112" cy="348" r="4" fill="#315d4b"/>
    <text x="160" y="408" text-anchor="middle" class="sans label">목표 위치</text>
    <text x="160" y="436" text-anchor="middle" class="sans body">동작 방향 · 상태 명령</text>
  </g>

  <path d="M256 350H344" class="signal" marker-end="url(#arrow-blue)"/>
  <text x="300" y="330" text-anchor="middle" class="mono pin">LIN BUS</text>
  <path d="M256 382H344" stroke="#76827b" stroke-width="2"/>
  <text x="300" y="404" text-anchor="middle" class="mono tiny">GND</text>

  <g aria-label="액추에이터 내부 제어 PCB">
    <rect x="332" y="220" width="1204" height="586" rx="10" class="board"/>
    <text x="360" y="258" class="mono eyebrow">ACTUATOR INTERNAL PCB</text>
    <path d="M360 278H1508" class="hair"/>

    <g aria-label="LIN 트랜시버">
      <text x="370" y="316" class="sans section">LIN 트랜시버</text>
      <rect x="370" y="344" width="190" height="180" rx="5" class="chip"/>
      <text x="465" y="395" text-anchor="middle" class="mono chiptext">LIN PHY</text>
      <path d="M404 426H526M404 454H526" stroke="#a3c6ae" stroke-width="3"/>
      <text x="390" y="433" class="mono" fill="#a3c6ae" font-size="13">RXD</text>
      <text x="390" y="461" class="mono" fill="#a3c6ae" font-size="13">TXD</text>
      <text x="370" y="560" class="sans body">단선 LIN 신호 수신·송신</text>
      <text x="370" y="587" class="sans body">MCU 로직 레벨 변환</text>
      <path d="M560 426H606" class="signal" marker-end="url(#arrow-blue)"/>
      <path d="M606 458H560" class="signal" marker-end="url(#arrow-blue)"/>
      <text x="583" y="409" text-anchor="middle" class="mono pin">RXD</text>
      <text x="583" y="482" text-anchor="middle" class="mono pin">TXD</text>
    </g>

    <g aria-label="MCU 내부 로직">
      <text x="622" y="316" class="sans section">MCU 내부 로직</text>
      <rect x="622" y="344" width="408" height="350" rx="7" fill="#ffffff" stroke="#181a18" stroke-width="3"/>
      <path d="M622 414H1030M622 515H1030M622 616H1030" class="hair"/>

      <text x="648" y="379" class="mono eyebrow">LIN ASW</text>
      <text x="648" y="405" class="sans body">프레임 수신 · 목표 위치/방향 해석 · 상태 응답</text>

      <text x="648" y="452" class="mono eyebrow">MOTOR DRIVER SW</text>
      <text x="648" y="482" class="sans body">상태 전이 · 시작/구동/정지 · 회전 방향</text>
      <text x="648" y="506" class="sans body">인버터 출력 순서 · 이상 상태 대응</text>

      <text x="648" y="553" class="mono eyebrow">MCU PERIPHERALS</text>
      <rect x="648" y="570" width="166" height="32" rx="3" fill="#e8f0eb"/>
      <rect x="830" y="570" width="174" height="32" rx="3" fill="#e8f0eb"/>
      <text x="731" y="592" text-anchor="middle" class="mono pin">TIMER / OUTPUT</text>
      <text x="917" y="592" text-anchor="middle" class="mono pin">ADC / PROTECTION</text>

      <text x="648" y="654" class="sans body">MCU 변경 시 주변장치와 출력 구조에 맞춰 재설계</text>
      <path d="M1030 483H1088" class="wire" marker-end="url(#arrow-green)"/>
      <text x="1058" y="464" text-anchor="middle" class="mono pin">6 GATE</text>
      <text x="1058" y="505" text-anchor="middle" class="mono pin">OUTPUTS</text>
    </g>

    <g aria-label="3상 인버터">
      <text x="1102" y="316" class="sans section">3상 인버터</text>
      <rect x="1090" y="344" width="276" height="350" rx="7" fill="#ffffff" stroke="#181a18" stroke-width="3"/>
      <text x="1110" y="378" class="mono pin">DC+</text>
      <line x1="1110" y1="394" x2="1340" y2="394" class="dark"/>
      <line x1="1110" y1="626" x2="1340" y2="626" class="dark"/>
      <text x="1110" y="654" class="mono pin">DC−</text>

      <g>
        <rect x="1130" y="420" width="48" height="58" rx="3" class="fet"/>
        <rect x="1130" y="542" width="48" height="58" rx="3" class="fet"/>
        <rect x="1202" y="420" width="48" height="58" rx="3" class="fet"/>
        <rect x="1202" y="542" width="48" height="58" rx="3" class="fet"/>
        <rect x="1274" y="420" width="48" height="58" rx="3" class="fet"/>
        <rect x="1274" y="542" width="48" height="58" rx="3" class="fet"/>
        <text x="1154" y="456" text-anchor="middle" class="mono pin">Q1</text>
        <text x="1154" y="578" text-anchor="middle" class="mono pin">Q2</text>
        <text x="1226" y="456" text-anchor="middle" class="mono pin">Q3</text>
        <text x="1226" y="578" text-anchor="middle" class="mono pin">Q4</text>
        <text x="1298" y="456" text-anchor="middle" class="mono pin">Q5</text>
        <text x="1298" y="578" text-anchor="middle" class="mono pin">Q6</text>
      </g>
      <g stroke="#181a18" stroke-width="3" fill="none">
        <path d="M1154 394V420M1154 478V510M1154 510V542M1154 600V626"/>
        <path d="M1226 394V420M1226 478V510M1226 510V542M1226 600V626"/>
        <path d="M1298 394V420M1298 478V510M1298 510V542M1298 600V626"/>
      </g>
      <circle cx="1154" cy="510" r="5" fill="#315d4b"/>
      <circle cx="1226" cy="510" r="5" fill="#315d4b"/>
      <circle cx="1298" cy="510" r="5" fill="#315d4b"/>
      <path d="M1154 510H1396M1226 510H1396M1298 510H1396" class="wire"/>
      <text x="1154" y="681" text-anchor="middle" class="mono pin">U</text>
      <text x="1226" y="681" text-anchor="middle" class="mono pin">V</text>
      <text x="1298" y="681" text-anchor="middle" class="mono pin">W</text>
    </g>

    <g aria-label="PMSM">
      <text x="1400" y="316" class="sans section">PMSM</text>
      <circle cx="1434" cy="508" r="82" fill="#ffffff" stroke="#181a18" stroke-width="3"/>
      <circle cx="1434" cy="508" r="36" fill="#e8f0eb" stroke="#315d4b" stroke-width="3"/>
      <path d="M1434 426V458M1505 467L1477 483M1505 549L1477 533M1434 590V558M1363 549L1391 533M1363 467L1391 483" class="wire"/>
      <path d="M1400 400C1440 374 1494 398 1508 444" class="wire" marker-end="url(#arrow-green)"/>
      <text x="1434" y="635" text-anchor="middle" class="sans body">3상 출력 → 회전</text>
    </g>

    <path d="M1434 610V742H908V696" class="feedback" marker-end="url(#arrow-gray)"/>
    <text x="1168" y="765" text-anchor="middle" class="mono tiny">전류·전압·동작 상태 피드백</text>
  </g>

  <g aria-label="세대별 개발 범위">
    <text x="64" y="862" class="mono eyebrow">GENERATION SCOPE</text>
    <line x1="64" y1="884" x2="1536" y2="884" class="hair"/>
    <text x="64" y="921" class="sans label">1세대</text>
    <text x="138" y="921" class="sans body">MCU 공급사 드라이빙 코드 기반 적용 · 동작 확인 · 액추에이터 양산</text>
    <line x1="790" y1="900" x2="790" y2="938" class="hair"/>
    <text x="830" y="921" class="sans label">2세대</text>
    <text x="904" y="921" class="sans body">신규 MCU 주변장치/출력 구조 재설계 · 인버터/PMSM 로직 구현·디버깅</text>
  </g>
</svg>
